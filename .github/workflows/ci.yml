# CI: the playwright suite (chromium + webkit), once per supported spine-core.
#
# The visual tests are A/B within one run and one engine (no golden files),
# so they are platform-independent by design — ubuntu results are valid even
# though local dev is macOS. Headless numbers are never performance
# evidence; nothing here asserts timing.
#
# ## Why there is a matrix
#
# A Spine runtime reads only the data its own generation exported, so a
# consumer installs the spine-core that matches their editor and this package
# has to draw from either (the seam is `src/coreCompat.ts`). "Supported" is not
# a claim in the README, it is a column here that is green against *that
# version's own example exports* — which is why each column also refetches the
# matching spine-runtimes branch. `peerDependencies` in package.json is exactly
# the set of minors listed below; widening one without the other is the bug
# this file exists to prevent.
#
# The column's core is installed over the lockfile's with `bun add --no-save`,
# which writes node_modules and leaves package.json and bun.lock alone
# (verified by the guard step). The repository keeps ONE spine-core
# devDependency; nothing here commits a second.
#
# A column may also be green with *fewer* tests than another, and when it is,
# the reason is always a fact about the installed peer that this repository
# measures in the run rather than a version listed here. Today that is
# tests/package.spec.ts: plain node cannot import spine-core 4.0 (extensionless
# relative specifiers, no `"type": "module"`), and spine-core 4.1's own `.d.ts`
# does not typecheck under `nodenext` (one extensionless specifier in
# SkeletonData.d.ts). Both are upstream defects, both are invisible to every
# bundler and to esm.sh — which is how those runtimes are actually consumed —
# and the spec probes the peer *by itself* before skipping the one assertion
# each takes away. See that file's header.
#
# The pixel oracle (tests/oracle.spec.ts) draws the same skeleton with
# `@esotericsoftware/spine-webgl` and diffs the two pictures, so a column needs
# its reference of the *same* generation — a 4.3 reference over 4.2 data would
# be comparing against a runtime that cannot read it. spine-webgl pins
# spine-core to its own exact version, so the pair is installed in ONE command:
# asking for `@4.2` twice in sequence could resolve a different patch each time
# and leave a nested second copy of spine-core under spine-webgl, which is the
# one shape that would quietly give the oracle's two sides different maths
# while every version line still read correctly. The guard step checks for that
# copy as well as for the versions.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A pull request opened by GITHUB_TOKEN — release-please's — gets its run
  # created and then held at `action_required` (nothing executes until a
  # maintainer approves it), so the release branch is tested on demand from
  # here instead. See RELEASING.md.
  workflow_dispatch:
    inputs:
      parity_dump:
        # The parity diff counts bad pixels but cannot say where they are, and
        # the one platform whose residue is unexplained (linux WebKit) exists
        # only on this runner. With this on, every parity cell also writes the
        # two captures, a red/yellow diff mask and metrics.json, and the run
        # uploads them green or red. See the header of tests/parity.spec.ts.
        description: 'Dump parity captures + diff masks as an artifact'
        type: boolean
        default: false

jobs:
  test:
    name: test (spine-core ${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every column's result is wanted: "4.2 broke" and "4.3 broke" are
      # different facts, and cancelling the rest would hide one of them.
      fail-fast: false
      matrix:
        # The typed column first. `typed` marks the one minor `src/` and
        # `tests/` are written against — see playwright.config.ts.
        include:
          - core: '4.3'
            typed: true
          - core: '4.2'
            typed: false
          # 4.1 and 4.0 are #53. They were left out of #40 for packaging
          # reasons and not rendering ones, and both are still true of them:
          # `Physics` is absent from their root entry (so every page here
          # reaches it through the namespace and feature-tests it), plain node
          # cannot import 4.0, and 4.1's own `.d.ts` fails a nodenext consumer
          # typecheck. Those last two are upstream's, and tests/package.spec.ts
          # skips exactly the two assertions that need them — by probing the
          # installed peer alone, never by naming a version, and never by
          # loosening anything in the columns above.
          - core: '4.1'
            typed: false
          - core: '4.0'
            typed: false
    env:
      # Which minor this run is against: turns off `tsc --noEmit` outside the
      # typed column (playwright.config.ts) and picks the matching exports
      # (scripts/fetch-assets.sh).
      SPINE_CORE_MINOR: ${{ matrix.core }}
      SPINE_ASSETS_BRANCH: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Install this column's spine-core and its matching reference runtime
        if: ${{ !matrix.typed }}
        run: |
          bun add --no-save \
            "@esotericsoftware/spine-core@${{ matrix.core }}" \
            "@esotericsoftware/spine-webgl@${{ matrix.core }}"

      # Two facts the column would otherwise only imply: that the swap took,
      # and that it left the repository's own manifest and lockfile alone. A
      # silently-unswapped column would test 4.3 twice and call it coverage.
      - name: The installed core and reference are the column's, and nothing was committed
        run: |
          installed=$(node -p "require('./node_modules/@esotericsoftware/spine-core/package.json').version")
          reference=$(node -p "require('./node_modules/@esotericsoftware/spine-webgl/package.json').version")
          echo "spine-core $installed / spine-webgl $reference"
          case "$installed" in
            ${{ matrix.core }}.*) ;;
            *) echo "expected spine-core ${{ matrix.core }}.x, got $installed"; exit 1 ;;
          esac
          case "$reference" in
            ${{ matrix.core }}.*) ;;
            *) echo "expected spine-webgl ${{ matrix.core }}.x, got $reference"; exit 1 ;;
          esac
          # One spine-core, and it is the one above: a nested copy under
          # spine-webgl would hand the oracle's two sides different runtimes.
          if [ -d node_modules/@esotericsoftware/spine-webgl/node_modules ]; then
            echo "spine-webgl brought its own spine-core:"
            ls node_modules/@esotericsoftware/spine-webgl/node_modules
            exit 1
          fi
          git diff --exit-code -- package.json bun.lock

      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run test
        env:
          # Empty on push / pull_request — the spec only dumps on the exact
          # string "1", so those runs are the unchanged default path.
          PARITY_DUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.parity_dump && '1' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.core }}
          path: test-results/
          if-no-files-found: ignore
      # The dump is the point of such a run, so it must be uploaded whether the
      # suite ends green or red. Two Actions rules shape the condition:
      #   1. a step `if:` with no status function means `success() && <expr>`,
      #      so the dispatch clause alone would skip the upload exactly when
      #      the suite failed — the run most worth looking at;
      #   2. ANY status function in the expression removes that implicit
      #      success(), so the outcome guard has to be spelled out — hence
      #      `(success() || failure())`.
      # It is ANDed with the dispatch clause rather than written as
      # `failure() || <dispatch clause>` so that ordinary push/pull_request
      # failures do not also upload under a name promising a dump they do not
      # contain. Those events keep exactly today's behaviour: the
      # `test-results` upload above, on failure only.
      - if: ${{ (success() || failure()) && github.event_name == 'workflow_dispatch' && inputs.parity_dump }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-dump-${{ matrix.core }}
          path: test-results/
          if-no-files-found: ignore
